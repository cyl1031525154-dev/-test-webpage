<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星河智能产品介绍</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --muted: #5d6b82;
      --surface: rgba(255, 255, 255, 0.86);
      --border: rgba(37, 99, 235, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.34), transparent 32rem),
        linear-gradient(135deg, #f8fbff 0%, #eef5ff 52%, #e0edff 100%);
    }

    .hero {
      width: min(100%, 880px);
      padding: clamp(32px, 7vw, 72px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(30, 64, 175, 0.16);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    .description {
      max-width: 680px;
      margin: 24px auto 36px;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.8;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 30px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.26);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .contact-button:hover,
    .contact-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.34);
    }

    .contact-button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.28);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="page-title">
    <p class="eyebrow">智能协作平台</p>
    <h1 id="page-title">让团队高效连接未来</h1>
    <p class="description">
      星河智能产品将任务管理、实时沟通和数据洞察整合在一个简洁工作台中，帮助企业快速推进项目、降低协作成本，并持续提升客户体验。
    </p>
    <a class="contact-button" href="mailto:hello@example.com">联系我们</a>
  </main>
</body>
</html>
